<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼仪提示打印卡 - 西安文化</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/guide.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="pub-toolbar no-print">
            <strong>打印卡</strong>
            <label>受众筛选
                <select id="pub-audience">
                    <option value="">全部</option>
                    <option value="resident">居民</option>
                    <option value="tourist">游客</option>
                    <option value="staff">现场工作人员</option>
                </select>
            </label>
            <label>语言
                <select id="pub-lang">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </label>
            <button class="btn primary" onclick="window.print()">打印</button>
            <a href="guide.html">返回礼仪提示</a>
        </div>
        <div id="pub"></div>
    </main>
    <script src="js/publication.js"></script>
    <script>
        // 打印卡与分享页共用 js/publication.js, 从同一批准集合(/api/publications)生成
        const params = new URLSearchParams(location.search);
        const pubId = params.get('pub') || 'latest';
        let current = null;
        async function draw() {
            current = await PublicationUI.renderInto(document.getElementById('pub'), {
                pubId,
                audience: document.getElementById('pub-audience').value || null,
                lang: document.getElementById('pub-lang').value
            });
        }
        document.getElementById('pub-audience').addEventListener('change', draw);
        document.getElementById('pub-lang').addEventListener('change', draw);
        draw();
    </script>
</body>
</html>
